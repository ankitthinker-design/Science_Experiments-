<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Material Changes Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Hind:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: warm, playful, one small thing at a time for 6–10 year olds; calm teacher notes on demand
IDEA: a board-game journey — a path of stepping stones that unlock one by one
PICTURE: the journey map, then one big card per screen (a diagram, a jar, a live glass of water)
COLOUR and TYPE: turmeric-yellow ground, deep plum ink, tomato accent, leaf-green for "done"; Baloo 2 + Hind
LAYOUT: phone-first single column, max 600px, sticky Back/Next bar at the bottom */
:root{color-scheme:light dark;
--bg:light-dark(#ffc83d,#2a1f0a);--ink:light-dark(#2b1538,#f6ecd4);--soft:light-dark(#6a5a73,#c9b99a);
--card:light-dark(#ffffff,#1d1424);--cink:light-dark(#2b1538,#f3eaf6);--line:light-dark(#eadfee,#3b2d45);
--plum:light-dark(#4b2160,#d9b6ee);--onplum:light-dark(#ffffff,#1d1424);--tom:light-dark(#d93a26,#ff7a63);--ok:light-dark(#1f7a4a,#6fe0a2);
--water:light-dark(#dff1fb,#17384a);--wdot:light-dark(#8cc8ea,#3d7fa3);--sugar:light-dark(#ffffff,#fff7e6);--glass:light-dark(#9fb6c4,#6b8899);
--lock:light-dark(#e9c76a,#4a3a17)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:17px/1.55 Hind,"Noto Sans Devanagari",system-ui,sans-serif;overflow-x:clip;min-height:100vh;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
h1,h2,h3{font-family:"Baloo 2",Hind,sans-serif;line-height:1.1;text-wrap:balance;margin:0 0 .35em}
h1{font-size:clamp(32px,8vw,46px);font-weight:800}
h2{font-size:clamp(26px,6.5vw,34px);font-weight:800}
h3{font-size:20px;font-weight:700}
p{margin:.2em 0 .7em}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--tom);outline-offset:2px}
.hi2{display:block;font-size:.86em;opacity:.8;font-weight:inherit}
.wrap{max-width:600px;margin:0 auto;padding:0 16px}
/* header */
.bar{display:flex;align-items:center;gap:8px;padding:10px 16px;max-width:600px;margin:0 auto}
.bar .home{background:none;border:0;font:800 19px "Baloo 2",sans-serif;padding:6px 0;min-height:44px;margin-right:auto;text-align:left;line-height:1.1}
.seg{display:flex;background:rgba(43,21,56,.12);border-radius:12px;padding:3px}
.seg button{border:0;background:none;padding:6px 9px;border-radius:9px;font-weight:600;font-size:14px;min-height:38px}
.seg button[aria-pressed=true]{background:var(--plum);color:var(--onplum)}
.tbtn{border:2px solid currentColor;background:none;border-radius:12px;padding:6px 10px;font-weight:600;font-size:14px;min-height:42px}
/* cards */
.card{background:var(--card);color:var(--cink);border-radius:24px;padding:20px 18px;box-shadow:0 8px 0 rgba(43,21,56,.16);margin:8px 0 16px}
.kicker{font:700 15px "Baloo 2",sans-serif;color:var(--tom);margin-bottom:2px}
.big{font-size:19px}
.words{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.words span{background:color-mix(in srgb,var(--plum) 12%,transparent);color:var(--plum);border-radius:99px;padding:4px 12px;font-weight:600;font-size:15px}
.words b{display:block;font:800 13px "Baloo 2",sans-serif;width:100%;color:var(--soft)}
/* options */
.opts{display:grid;gap:10px;margin-top:14px}
.opt{border:3px solid var(--line);background:var(--card);border-radius:16px;padding:12px 14px;min-height:56px;text-align:left;font-weight:600;font-size:18px;line-height:1.25}
.opt:hover:not(:disabled){border-color:var(--plum)}
.opt.r{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--card))}
.opt.w{border-color:var(--tom);background:color-mix(in srgb,var(--tom) 10%,var(--card));opacity:.75}
.opt:disabled{cursor:default}
.fb{margin-top:14px;padding:12px 14px;border-radius:14px;background:color-mix(in srgb,var(--ok) 12%,transparent);font-size:17px}
.fb.x{background:color-mix(in srgb,var(--tom) 10%,transparent)}
.fb b{font-family:"Baloo 2",sans-serif;font-size:19px}
.count{font:700 15px "Baloo 2",sans-serif;color:var(--soft)}
.pbar{height:8px;border-radius:9px;background:var(--line);overflow:hidden;margin:6px 0 14px}.pbar i{display:block;height:100%;background:var(--ok);transition:width .3s}
.inline{border:0;background:var(--plum);color:var(--onplum);border-radius:14px;padding:10px 18px;min-height:48px;font-weight:700;margin-top:12px}
/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:2px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:4}
.nav .wrap{display:flex;gap:10px;padding:0}
.nav button{min-height:54px;border-radius:16px;font:800 19px "Baloo 2",sans-serif;padding:4px 16px;line-height:1.1}
.nav .back{border:2px solid var(--line);background:none;color:var(--cink)}
.nav .next{flex:1;border:0;background:var(--tom);color:#fff}
.nav .next:disabled{background:var(--line);color:var(--soft);cursor:not-allowed}
.nav .hint{font-size:13px;font-family:Hind,sans-serif;font-weight:500;display:block}
/* map */
.map{list-style:none;margin:10px 0 0;padding:0;position:relative}
.map:before{content:"";position:absolute;left:33px;top:30px;bottom:30px;border-left:6px dotted rgba(43,21,56,.3)}
.map li{position:relative;margin:0 0 14px}
.stone{display:flex;align-items:center;gap:14px;width:100%;border:0;background:var(--card);color:var(--cink);border-radius:22px;padding:12px 14px 12px 10px;text-align:left;box-shadow:0 6px 0 rgba(43,21,56,.14);min-height:76px}
.stone .n{flex:none;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font:800 22px "Baloo 2",sans-serif;background:var(--plum);color:var(--onplum)}
.stone.done .n{background:var(--ok);color:var(--card)}
.stone.locked{background:var(--lock);color:var(--soft);box-shadow:none;cursor:not-allowed}
.stone.locked .n{background:rgba(0,0,0,.12);color:var(--soft)}
.stone.now{outline:4px solid var(--tom);outline-offset:2px}
.stone .t{font:700 19px "Baloo 2",sans-serif;line-height:1.15}
.stone small{display:block;font-size:14px;color:var(--soft)}
@media(prefers-reduced-motion:no-preference){.stone.now .n{animation:pop 1.6s ease-in-out infinite}@keyframes pop{50%{transform:scale(1.1)}}}
/* welcome */
.langpick{display:grid;gap:12px;margin-top:16px}
.langpick button{border:0;border-radius:18px;background:var(--plum);color:var(--onplum);min-height:64px;font:800 22px "Baloo 2",Hind,sans-serif}
/* figures */
svg.flow{width:100%;height:auto;display:block}
.flow text{font:700 15px "Baloo 2",Hind,sans-serif;fill:currentColor}
.jars{display:grid;grid-template-columns:1fr 1fr;gap:10px;text-align:center;font:700 16px "Baloo 2",Hind,sans-serif}
.jars svg,.jar1 svg{width:100%;max-width:170px;height:auto;display:block;margin:0 auto}
.jar1{text-align:center;margin-top:10px;font:700 17px "Baloo 2",Hind,sans-serif}
.eq{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px;margin:12px 0;font:800 20px "Baloo 2",Hind,sans-serif;text-align:center}
.eq span{background:color-mix(in srgb,var(--plum) 10%,transparent);border-radius:16px;padding:10px 12px;line-height:1.15}
.eq span small{display:block;font:600 14px Hind,sans-serif;color:var(--tom)}
.meth{display:grid;gap:10px;margin-top:6px}
.meth div{display:flex;gap:12px;align-items:center;background:color-mix(in srgb,var(--plum) 7%,transparent);border-radius:16px;padding:10px 12px}
.meth svg{flex:none;width:52px;height:52px}
.bubble{background:color-mix(in srgb,var(--tom) 10%,transparent);border-radius:18px;padding:12px 14px;margin:8px 0;position:relative;font-size:18px}
.bubble b{font-family:"Baloo 2",sans-serif}
/* lab */
.fig{position:relative;height:250px;border-radius:18px;background:color-mix(in srgb,var(--plum) 5%,transparent);overflow:hidden}
.fig canvas{position:absolute;inset:0;width:100%;height:100%}
.timer{position:absolute;top:8px;left:12px;font:800 30px "Baloo 2",sans-serif;color:var(--plum);z-index:1;line-height:1}
.timer small{display:block;font:500 12px Hind,sans-serif;color:var(--soft)}
.ctl{display:grid;gap:10px;margin-top:12px}
.ctl .lab{font:700 15px "Baloo 2",Hind,sans-serif;margin-bottom:4px}
.tg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
.tg button{border:2px solid var(--line);background:none;border-radius:12px;min-height:46px;font-weight:600;font-size:15px;padding:4px 6px;line-height:1.15}
.tg button[aria-pressed=true]{background:var(--plum);border-color:var(--plum);color:var(--onplum)}
.go{width:100%;border:0;background:var(--tom);color:#fff;border-radius:14px;min-height:52px;font:800 19px "Baloo 2",sans-serif;margin-top:4px}
.go:disabled{opacity:.45;cursor:not-allowed}
.check{list-style:none;padding:0;margin:12px 0 0;display:grid;gap:6px}
.check li{display:flex;gap:10px;align-items:center;font-weight:600}
.check li i{flex:none;width:26px;height:26px;border-radius:8px;border:3px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:16px}
.check li.y i{background:var(--ok);border-color:var(--ok);color:var(--card)}
.log{font-size:15px;margin-top:10px;color:var(--soft)}
.log div{padding:4px 0;border-top:1px solid var(--line)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--soft);margin-top:8px}
.legend i{display:inline-block;width:11px;height:11px;margin-right:5px;vertical-align:-1px}
/* celebration */
.star{width:150px;height:150px;display:block;margin:4px auto 8px}
/* teacher sheet */
.sheet{position:fixed;inset:0;z-index:10;background:rgba(20,10,25,.55);display:none;align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.sheet .in{background:var(--card);color:var(--cink);width:100%;max-width:680px;max-height:88vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px 18px calc(24px + env(safe-area-inset-bottom));font-size:16px}
.sheet .top{display:flex;justify-content:space-between;align-items:center;gap:10px;position:sticky;top:-18px;background:var(--card);padding:6px 0 8px;margin-top:-6px}
.sheet .x{border:2px solid var(--line);background:none;border-radius:12px;min-height:44px;padding:4px 14px;font-weight:700}
.sheet ul{padding-left:1.2em;margin:.3em 0 .9em}.sheet li{margin:.3em 0}
.sheet details{border:2px solid var(--line);border-radius:14px;padding:0 14px;margin:8px 0}
.sheet summary{font:700 18px "Baloo 2",sans-serif;padding:10px 0;min-height:44px;cursor:pointer}
.say{display:block;background:color-mix(in srgb,#ffc83d 40%,transparent);border-radius:10px;padding:6px 10px;margin:.3em 0}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.tools button{border:2px solid var(--line);background:none;border-radius:12px;min-height:44px;padding:4px 12px;font-weight:600}
.tnote{background:color-mix(in srgb,var(--tom) 8%,transparent);border-left:5px solid var(--tom);border-radius:0 12px 12px 0;padding:10px 12px;margin:10px 0}
@media(max-width:380px){.bar .home small{display:none}.seg button{padding:6px 7px}}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0 20px}
.tile{border:0;border-radius:22px;padding:14px;min-height:128px;text-align:left;display:flex;flex-direction:column;gap:6px;box-shadow:0 6px 0 rgba(43,21,56,.16);font:800 21px "Baloo 2",Hind,sans-serif;line-height:1.1}
.tile.n{background:var(--plum);color:var(--onplum)}.tile.a{background:var(--card);color:var(--cink)}
.tile svg{width:46px;height:46px}.tile small{font:500 14px Hind,sans-serif;opacity:.85;line-height:1.3}
.nlist{display:grid;gap:10px;margin-top:10px}
.nitem{display:flex;gap:12px;align-items:center;border:0;background:var(--card);color:var(--cink);border-radius:18px;padding:10px 12px;text-align:left;min-height:76px;box-shadow:0 5px 0 rgba(43,21,56,.12)}
.nitem svg{flex:none;width:64px;height:56px;border-radius:14px;background:color-mix(in srgb,var(--plum) 8%,transparent)}
.pic{background:color-mix(in srgb,var(--plum) 6%,transparent);border-radius:18px;padding:12px;margin:10px 0 14px}
.pic svg{width:100%;height:auto;display:block}
.lbl{font:700 14px "Baloo 2",Hind,sans-serif;fill:currentColor}
.bagrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin:8px 0}
.ba{background:color-mix(in srgb,var(--plum) 6%,transparent);border-radius:16px;padding:10px 8px;text-align:center;display:flex;flex-direction:column;align-items:center}
.ba svg{width:100%;max-width:140px;height:auto}.ba .nm{font:700 17px "Baloo 2",Hind,sans-serif;line-height:1.15}.ba .st{font-size:15px;min-height:2.6em;line-height:1.3}
.ba .inline{margin-top:auto}
.sm{min-height:44px;padding:6px 14px;margin-top:6px;font-size:16px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.remember{background:color-mix(in srgb,var(--ok) 13%,transparent);border-radius:16px;padding:12px 14px;margin:14px 0}
.remember ul{margin:.2em 0 0;padding-left:1.2em}.remember li{margin:.25em 0}
.athome{background:color-mix(in srgb,#ffc83d 38%,transparent);border-radius:16px;padding:12px 14px;margin:14px 0}
details.think{border:3px dashed var(--plum);border-radius:16px;padding:0 14px;margin:14px 0}
details.think summary{font:700 18px "Baloo 2",Hind,sans-serif;padding:12px 0;cursor:pointer;min-height:44px;line-height:1.25}
.anim .mv{transition:transform 1.4s cubic-bezier(.5,0,.5,1),opacity .3s}.anim.run .mv{transform:translate(var(--dx,0px),var(--dy,0px));opacity:1}
.anim .grow{transform-box:fill-box;transform-origin:50% 100%;transform:scaleY(0);transition:transform 2s .8s}.anim.run .grow{transform:scaleY(1)}
.anim .fade{transition:opacity 2s .4s}.anim.run .fade{opacity:0}
.anim.run .shake{animation:shk .25s 5}@keyframes shk{50%{transform:translateX(5px)}}
@media(prefers-reduced-motion:reduce){.anim .mv,.anim .grow,.anim .fade{transition-duration:.01s!important;transition-delay:0s!important}.anim.run .shake{animation:none}}
.tabs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;margin-bottom:6px}
.tabs button{border:2px solid var(--line);background:none;border-radius:12px;min-height:46px;font-weight:700;font-size:16px;line-height:1.15}
.tabs button[aria-pressed=true]{background:var(--plum);border-color:var(--plum);color:var(--onplum)}
.race{margin:10px 0;background:color-mix(in srgb,var(--plum) 6%,transparent);border-radius:16px;padding:12px}
.race h3{margin:0 0 4px}
.lane{display:grid;grid-template-columns:7em minmax(0,1fr);gap:8px;align-items:center;margin:6px 0;font-size:15px;font-weight:600;line-height:1.2}
.track{height:22px;border-radius:11px;background:var(--line);overflow:hidden}.track i{display:block;height:100%;width:0;border-radius:11px}
.gas{display:flex;height:36px;border-radius:12px;overflow:hidden;margin:8px 0 2px;font-size:13px;font-weight:700;color:#fff}
.gas span{display:grid;place-items:center;white-space:nowrap;overflow:hidden}
input[type=range]{width:100%;height:44px;accent-color:var(--tom)}
.facts{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.fact{background:color-mix(in srgb,var(--plum) 6%,transparent);border-radius:16px;padding:10px 12px;display:flex;gap:12px;align-items:center;font-size:15px;line-height:1.4}
.fact svg{flex:none;width:60px;height:60px}
.readmore{width:100%;margin:-4px 0 14px}
.tiles .wide{grid-column:1/-1;min-height:96px;flex-direction:row;align-items:center;gap:14px;background:#2b1538;color:#ffe7a8}
.send{border:3px solid #25a35a}.go.wa{display:flex;align-items:center;justify-content:center;text-decoration:none;background:#1f8f4e;margin:6px 0 8px}
.tiles .wide span{display:flex;flex-direction:column;gap:4px}
.need{padding-left:1.2em;margin:.2em 0 .8em}.need li{margin:.2em 0}
.fld{display:block;margin:12px 0}.fld>span{display:block;font:700 16px "Baloo 2",Hind,sans-serif;margin-bottom:4px;line-height:1.25}
.fld textarea,.fld input{width:100%;font:16px Hind,sans-serif;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--cink)}
.fld textarea:focus,.fld input:focus{outline:3px solid var(--tom);outline-offset:1px}
.check.big2 li{display:block}.check.big2 button{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:2px solid var(--line);background:none;border-radius:14px;padding:10px 12px;min-height:52px;font-size:17px;font-weight:500;line-height:1.35}
.check.big2 li.y button{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,transparent)}
.check.big2 i{margin-top:1px}
.upl{display:flex;align-items:center;justify-content:center;min-height:56px;border:3px dashed var(--plum);border-radius:16px;font:700 18px "Baloo 2",Hind,sans-serif;color:var(--plum);cursor:pointer;margin:8px 0}
.upl input{position:absolute;width:1px;height:1px;opacity:0}
.upl:focus-within{outline:3px solid var(--tom)}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.thumbs div{position:relative}.thumbs img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;display:block}
.thumbs button{position:absolute;top:4px;right:4px;width:32px;height:32px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:20px;line-height:1}
.pad{position:relative;height:240px;border:2px solid var(--line);border-radius:16px;overflow:hidden;margin:8px 0;background:#fff}
.pad canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.dot{width:44px;height:44px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 2px var(--line)}
.labcard{width:100%;max-width:360px;border-radius:16px;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.memo{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.memo img{width:84px;height:84px;object-fit:cover;border-radius:14px;flex:none}
.memo>div,.memo h3,.memo .fb,.memo p,.memo .btns,.memo .kicker{flex-basis:100%}
.memo.mine{background:color-mix(in srgb,#ffc83d 35%,transparent);border-radius:16px;padding:10px 12px;margin-bottom:14px;flex-wrap:nowrap}
.memo.mine>div{flex-basis:auto;font-size:15px}
.card.memo{border:4px solid var(--tom)}
.namein{width:100%;font:20px Hind,sans-serif;padding:12px 14px;border:3px solid var(--line);border-radius:14px;margin:10px 0;background:var(--card);color:var(--cink)}
.send.off{border-color:var(--line)}
.csqh{display:flex;gap:10px;align-items:center;margin-top:16px}.csqh span{flex:none;width:30px;height:30px;border-radius:50%;background:var(--tom);color:#fff;display:grid;place-items:center;font-size:17px}
.bubble.sci{background:color-mix(in srgb,var(--ok) 13%,transparent)}
.mine2{background:color-mix(in srgb,#ffc83d 35%,transparent);border-radius:14px;padding:10px 12px;line-height:1.5}
.tg.ag{grid-auto-flow:row;grid-template-columns:1fr}
.fair{width:100%;border:2px solid var(--plum);background:none;border-radius:12px;min-height:46px;font-weight:700;font-size:15px;padding:6px 10px;margin:4px 0 10px;color:var(--plum);line-height:1.25}.fair[aria-pressed=true]{background:var(--plum);color:var(--onplum)}
</style>
</head>
<body>
<div class="bar">
 <button class="home" id="home">Material Changes<small style="display:block;font:500 13px Hind,sans-serif">मटीरियल चेंजेस · map</small></button>
 <div class="seg" id="lang" role="group" aria-label="Language"><button data-l="en">EN</button><button data-l="hi">हिं</button><button data-l="both">दोनों</button></div>
 </div>
<div class="wrap" id="main"></div>
<div class="nav" id="nav"><div class="wrap"><button class="back" id="back">←</button><button class="next" id="next"></button></div></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Teacher notes"><div class="in" id="sheetIn"></div></div>
<footer class="wrap" style="font-size:13px;color:var(--soft);padding-bottom:12px">Based on Cambridge Primary Science Stage 6, Unit 3 · Material changes.</footer>

<script>
{
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const S={lang:null,done:0,all:false};

function seq(cfg){
 return {html:()=>`<div class="card"><div class="kicker">${LA(cfg.k)}</div><div id="sq"></div></div>`,
 mount(done){
  let i=cfg.state.i||0;
  const box=$('#sq');
  const draw=()=>{
   if(i>=cfg.items.length){box.innerHTML=cfg.end?cfg.end():`<h2>${L('All done!','सब हो गया!')}</h2><p class="big">${L('Press Next to go on.','आगे जाने के लिए Next दबाओ।')}</p>`;done();return}
   const it=cfg.items[i];
   box.innerHTML=`<div class="count">${i+1} / ${cfg.items.length}</div><div class="pbar"><i style="width:${i/cfg.items.length*100}%"></i></div>
    ${it.pic?it.pic():''}<h2>${LA(it.q)}</h2><div class="opts">${it.o.map((o,j)=>`<button class="opt" data-j="${j}">${LA(o)}</button>`).join('')}</div><div id="fb"></div>`;
   box.querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>{
    const j=+b.dataset.j,right=j===it.a;
    if(!right&&cfg.retry){b.classList.add('w');b.disabled=true;$('#fb').innerHTML=`<div class="fb x"><b>${L('Not quite — try again!','अभी नहीं — फिर से सोचो!')}</b> ${it.h?LA(it.h):''}</div>`;return}
    if(right&&cfg.score)cfg.state.sc=(cfg.state.sc||0)+1;
    box.querySelectorAll('.opt').forEach((x,k)=>{x.disabled=true;if(k===it.a)x.classList.add('r');else if(k===j)x.classList.add('w')});
    const head=right?(cfg.predict?L('Your prediction was right!','तुम्हारा अनुमान सही था!'):L('Yes! Well done.','शाबाश! सही।')):(cfg.predict?L('Surprise! Now you know.','अरे! अब तुम जान गए।'):L('Not this time.','इस बार नहीं।'));
    $('#fb').innerHTML=`${it.after?it.after():''}<div class="fb ${right?'':'x'}"><b>${head}</b> ${LA(it.f)}</div><button class="inline" id="nx">${i+1<cfg.items.length?L('Next card →','अगला कार्ड →'):L('Finish ✓','पूरा ✓')}</button>`;
    $('#nx').addEventListener('click',()=>{i++;cfg.state.i=i;draw()});
    $('#nx').focus({preventScroll:true});$('#fb').scrollIntoView({block:'nearest',behavior:'smooth'});
   }));
  };
  draw();
 }};
}

/* ---------- teacher sheet ---------- */
const GUIDE=`<details><summary>How to use this page in class</summary><ul><li>Show it on a TV or projector, or give one phone to each team of 3.</li><li><b>Experiments</b> (on the first page): 5 what-if questions. Children answer and send everything to you with one WhatsApp button.</li><li>These notes open only when the page address ends in <b>#teacher</b>, so children never see them.</li><li><b>Notes</b> (on the first page) are the reading material: 7 illustrated topics with pictures to tap. They are never locked — read a topic before its activity step.</li><li>Do ONE step per lesson. Each step has a short "Learn" card, then a "Try" activity. <b>Next</b> unlocks only when the activity is finished.</li><li>Do the real hands-on activity from these notes either before or after the screen. The screen does not replace the experiment.</li><li>Progress is saved on this device. "Unlock all" and "Start again" are below.</li></ul></details>
<details><summary>Your class: 6 children, 2 reading groups</summary><ul><li><b>Make 2 teams of 3:</b> each with 1 English reader and 2 Hindi readers.</li><li><b>Rotate roles:</b> Reader, Doer, Recorder. Switch the screen to हिं when a Hindi reader is the Reader, so English readers are not always in charge.</li><li><b>Word wall in two scripts:</b> dissolve · डिज़ॉल्व. Every child says each word aloud.</li><li><b>Talk first, words after:</b> let children explain in Hindi. The English label comes after they understand.</li><li><b>Ages 6–10:</b> younger children aim for "observe and sort". Older children go on to "fair test and particles".</li></ul></details>
<details><summary>Teaching methods used in this chapter</summary><ul><li><b>Predict · Observe · Explain:</b> a prediction before every test. Praise wrong predictions: "You tested your idea — that's real science!"</li><li><b>Think · Pair · Share:</b> 10 seconds of quiet thinking, then a whisper to a partner, then share.</li><li><b>Particle dance:</b> act out particles with their bodies.</li><li><b>Concept cartoon:</b> two characters disagree, and children decide who is right and test it.</li><li><b>Fair test:</b> change one thing, measure one thing, keep everything else the same.</li><li><b>Questioning ladder:</b> What do you see? → What happened? → Why? → What if…?</li><li><b>Science journal:</b> a before-and-after drawing every lesson.</li></ul></details>
<details><summary>Wrong ideas to listen for</summary><ul><li>"The sugar disappeared." → It spread out. Taste it, or dry the water in the sun.</li><li>"Melting and dissolving are the same." → Melting needs heat and one thing. Dissolving needs two things.</li><li>"Heat always makes irreversible changes." → Melting chocolate is reversible.</li><li>"Coloured water means it dissolved." → Look for clear vs cloudy (haldi).</li></ul></details>
<details><summary>Safety and materials</summary><ul><li>Only the teacher pours hot water and lights matches. Tasting only from clean cups kept apart from the experiments.</li><li>Kitchen kit: steel glasses, teaspoons, sugar, sugar cubes, salt, sand, atta, rajma, rice, chana, chalk, instant coffee, haldi, a chhalni, a chai strainer, cotton cloth, plastic bottles, ice, a phone stopwatch.</li></ul></details>
<details><summary>Checking learning</summary><ul><li><b>Starting:</b> sorts changes into "goes back / doesn't go back".</li><li><b>Growing:</b> uses reversible, mixture, soluble and solution correctly in either language.</li><li><b>Strong:</b> explains with particles why stirring, heat and small grains speed up dissolving, and plans a fair test.</li></ul></details>`;
function openSheet(){
 const s=view.s>=0&&view.n===undefined&&!view.x?ST[view.s]:null;
 $('#sheetIn').innerHTML=`<div class="top"><h2 style="margin:0">Teacher notes</h2><button class="x" id="sx">Close</button></div>
  ${view.x?LABT:view.n!==undefined?READ:s?`<div class="tnote"><h3>Step ${view.s+1}: ${s.t[0]}</h3>${s.teach}</div>`:`<p>Open a step to see the notes for that lesson, or open Notes for reading tips. The whole-chapter guide is below.</p>`}
  <h3 style="margin-top:14px">Whole-chapter guide</h3>${GUIDE}
  <div class="tools"><button id="ua">${S.all?'Lock steps again':'Unlock all steps'}</button><button id="rs">Start again (clear progress)</button></div>`;
 $('#sheet').classList.add('on');$('#sx').focus();
 $('#sx').onclick=closeSheet;
 const pc=$('#pcopy');if(pc)pc.onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText($('#pmsg').textContent).then(()=>pc.textContent='Copied ✓',()=>pc.textContent='Select the text and copy it')};

 $('#ua').onclick=()=>{S.all=!S.all;save();closeSheet();render()};
 $('#rs').onclick=()=>{S.done=0;S.all=false;save();location.reload()};
}
function closeSheet(){$('#sheet').classList.remove('on');if(location.hash==='#teacher')history.replaceState(null,'',location.pathname+location.search)}
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeSheet()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
const hashT=()=>{if(location.hash==='#teacher')openSheet()};addEventListener('hashchange',hashT);setTimeout(hashT,0);

/* ---------- render ---------- */
const nav=$('#nav'),nx=$('#next'),bk=$('#back');
function unlocked(i){return S.all||i<=S.done}
function render(){
 if(cleanup){cleanup();cleanup=null}
 $$('#lang button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.l===S.lang)));
 const m=$('#main');
 if(!S.lang){nav.style.display='none';
  m.innerHTML=`<div class="card" style="text-align:center"><svg class="star" viewBox="0 0 150 150" aria-hidden="true"><rect x="40" y="30" width="70" height="100" rx="10" fill="#dff1fb" stroke="#6b8899" stroke-width="5"/><rect x="44" y="66" width="62" height="60" rx="6" fill="#8cc8ea"/><rect x="58" y="104" width="10" height="10" fill="#fff" stroke="#4b2160" stroke-width="2"/><rect x="72" y="108" width="10" height="10" fill="#fff" stroke="#4b2160" stroke-width="2"/><rect x="66" y="94" width="10" height="10" fill="#fff" stroke="#4b2160" stroke-width="2"/><circle cx="60" cy="84" r="4" fill="#fff"/><circle cx="90" cy="78" r="3" fill="#fff"/></svg>
   <h1>Material Changes<br><span style="font-size:.7em">मटीरियल चेंजेस</span></h1><p class="big">Choose your language · अपनी भाषा चुनो</p>
   <div class="langpick"><button data-pl="hi">हिंदी</button><button data-pl="en">English</button><button data-pl="both">दोनों · Both</button></div></div>`;
  m.querySelectorAll('[data-pl]').forEach(b=>b.onclick=()=>{S.lang=b.dataset.pl;save();render()});return}
 if(S.name===undefined){nav.style.display='none';m.innerHTML=`<div class="card"><h2>${L('What is your name?','तुम्हारा नाम क्या है?')}</h2><p>${L('Your teacher will see it when you send your answers.','जवाब भेजने पर टीचर को तुम्हारा नाम दिखेगा।')}</p><input class="namein" id="nm" maxlength="30" autocomplete="given-name"><button class="go" id="nmok">${L('Continue','आगे चलो')}</button><button class="tbtn" id="nmskip" style="width:100%;margin-top:10px">${L('Skip','छोड़ो')}</button></div>`;$('#nmok').onclick=()=>{S.name=$('#nm').value.trim();save();render()};$('#nmskip').onclick=()=>{S.name='';save();render()};return}
 if(view.x){renderX(m);return}
 if(view.n!==undefined){nav.style.display='block';renderNotes(m);return}
 if(view.s<0){ // map
  nav.style.display='none';
  const all=S.done>=ST.length;
  m.innerHTML=`<div class="tiles"><button class="tile n" data-act="note:-1"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M6 10q9-4 18 2v28q-9-6-18-2z" fill="#ffc83d"/><path d="M42 10q-9-4-18 2v28q9-6 18-2z" fill="#fff"/></svg>${L('Notes','नोट्स')}<small>${L('Read and play with pictures','पढ़ो और चित्रों से खेलो')}</small></button><button class="tile a" data-act="start"><svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="20" fill="#d93a26"/><path d="M19 15l14 9-14 9z" fill="#fff"/></svg>${L('Activities','एक्टिविटीज़')}<small>${L(S.done>=ST.length?'All done — play again':'Continue step '+(S.done+1),S.done>=ST.length?'सब पूरा — फिर खेलो':'स्टेप '+(S.done+1)+' जारी रखो')}</small></button><button class="tile wide" data-act="xlab"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M18 4h12v4h-2v12l12 20q2 4-2 4H10q-4 0-2-4l12-20V8h-2z" fill="#dff1fb" stroke="#ffe7a8" stroke-width="2"/><path d="M12 36h24l3 5q1 2-1 2H10q-2 0-1-2z" fill="#d93a26"/><circle cx="22" cy="30" r="2" fill="#d93a26"/></svg><span>${L('Experiments','प्रयोग')}<small>${L('What would happen if…? Think like a scientist','अगर ऐसा हो तो क्या होगा…? वैज्ञानिक की तरह सोचो')}</small></span></button></div><h1 style="margin-top:6px">${L('Your science journey','तुम्हारी साइंस यात्रा')}</h1><p class="big">${all?L('You finished every step! You are a Material Changes Explorer.','तुमने हर स्टेप पूरा किया! तुम मटीरियल चेंजेस एक्सप्लोरर हो।'):L('Finish one step to unlock the next.','एक स्टेप पूरा करो, अगला खुलेगा।')}</p>
  <ol class="map">${ST.map((s,i)=>{const d=i<S.done,u=unlocked(i),now=i===S.done&&!all;return `<li><button class="stone ${d?'done':u?'':'locked'} ${now?'now':''}" data-s="${i}" ${u?'':'aria-disabled="true"'}><span class="n">${d?'✓':u?i+1:LOCK}</span><span><span class="t">${LA(s.t)}</span><small>${u?LA(s.sub):L('Locked','बंद है')}</small></span></button></li>`}).join('')}</ol>`;
  m.querySelectorAll('.stone').forEach(b=>b.onclick=()=>{const i=+b.dataset.s;if(!unlocked(i))return;view={s:i,p:0};render();scrollTo(0,0)});
  return}
 const s=ST[view.s],pg=s.pages[view.p],key=view.s+'-'+view.p;
 nav.style.display='block';
 m.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:4px"><div class="count">${L(`Step ${view.s+1} of ${ST.length}`,`स्टेप ${view.s+1} / ${ST.length}`)}</div><div class="count">${view.p+1} / ${s.pages.length}</div></div><h2 style="margin-top:2px">${LA(s.t)}</h2>${pg.html()}${view.p===0&&NMAP[view.s]!==undefined?`<button class="tbtn readmore" data-act="note:${NMAP[view.s]}">${L('Read more in the Notes →','नोट्स में और पढ़ो →')}</button>`:''}`;
 const ok=()=>{pageOk[key]=1;setNext()};
 if(pg.auto||view.s<S.done)pageOk[key]=pageOk[key]||(pg.auto?1:0);
 if(pg.mount)cleanup=pg.mount(ok)||null;
 setNext();
}
function setNext(){
 const s=ST[view.s],key=view.s+'-'+view.p,okay=!!pageOk[key]||view.s<S.done,last=view.p===s.pages.length-1;
 nx.disabled=!okay;
 nx.innerHTML=okay?(last?L('Finish step ✓','स्टेप पूरा ✓'):L('Next →','आगे →')):`${L('Next →','आगे →')}<span class="hint">${L('finish the activity first','पहले एक्टिविटी पूरी करो')}</span>`;
}
nx.addEventListener('click',()=>{
 if(view.x){xNext();return}
 if(view.n!==undefined){view.n=view.n<NOTES.length-1?view.n+1:-1;render();scrollTo(0,0);return}
 const s=ST[view.s];if(nx.disabled)return;
 if(view.p<s.pages.length-1){view.p++;render();scrollTo(0,0);return}
 if(view.s>=S.done){S.done=view.s+1;save()}
 celebrate();
});
bk.addEventListener('click',()=>{if(view.x){xBack();return}if(view.n!==undefined){view=view.n>=0?{s:-1,p:0,n:-1}:{s:-1,p:0};render();scrollTo(0,0);return}if(view.p>0){view.p--;render()}else{view={s:-1,p:0};render()}scrollTo(0,0)});
function celebrate(){
 if(cleanup){cleanup();cleanup=null}
 nav.style.display='none';const n=view.s,last=n===ST.length-1;
 $('#main').innerHTML=`<div class="card" style="text-align:center"><svg class="star" viewBox="0 0 100 100" aria-hidden="true"><path d="M50 6l12.6 27.4 29.9 3.3-22.3 20.2 6.2 29.5L50 71.5 23.6 86.4l6.2-29.5L7.5 36.7l29.9-3.3z" fill="#ffc83d" stroke="#d93a26" stroke-width="4" stroke-linejoin="round"/></svg>
 <h1>${L('Step done!','स्टेप पूरा!')}</h1><p class="big">${last?L('You finished the whole chapter. Super scientist!','तुमने पूरा चैप्टर पूरा किया। सुपर साइंटिस्ट!'):L(`You unlocked step ${n+2}: <b>${ST[n+1].t[0]}</b>`,`स्टेप ${n+2} खुल गया: <b>${ST[n+1].t[1]}</b>`)}</p>
 <button class="go" id="tomap">${L('Back to my journey','मेरी यात्रा पर वापस')}</button></div>`;
 $('#tomap').onclick=()=>{view={s:-1,p:0};render();scrollTo(0,0)};
}
$$('#lang button').forEach(b=>b.addEventListener('click',()=>{S.lang=b.dataset.l;save();if(view.s>=0&&ST[view.s].pages[view.p].mount){const st=ST[view.s].pages[view.p];render()}else render()}));
$('#home').addEventListener('click',()=>{view={s:-1,p:0};render();scrollTo(0,0)});
render();
}
</script>
</body>
</html>
